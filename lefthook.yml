# Fast, read-only gate. Nothing here rewrites or stages files; `bun run check` (and CI) runs the
# full suite. Fix findings with `bun run fmt` / `bun run contracts`.
pre-commit:
  parallel: true
  jobs:
    - name: format
      run: bun run fmt:check
    - name: lint-web
      run: bun run lint:web
    - name: typecheck
      run: bun run typecheck
    - name: contracts
      glob:
        - "crates/core/**"
        - "web/src/generated/**"
      run: cargo nextest run --locked -p kosse-core --test contracts
