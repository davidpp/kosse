# Fast, read-only gate. Nothing here rewrites or stages files; `bun run check` (and CI) runs the
# full suite. Fix findings with `bun run fmt` / `bun run contracts`.
pre-commit:
  parallel: true
  jobs:
    - name: format
      run: bun run fmt:check
    - name: lint-scripts
      run: bun run oxlint --deny-warnings
    - name: typecheck
      run: bun run typecheck
    - name: contracts
      glob:
        - "crates/core/**"
        - "contracts/**"
        - "docs/kosse.schema.json"
      run: cargo nextest run --locked -p kosse-core --test contracts --test profile_schema -E "test(typescript_bindings_are_current) | test(committed_schema_is_current)"
