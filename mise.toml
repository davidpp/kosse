# Contributor toolchain, resolved per repository (no global defaults needed).
# Keep rust in sync with rust-toolchain.toml and bun with package.json "packageManager".
# Node is needed only by the web test/build tooling (Vitest); the shipped binary needs neither.
[tools]
rust = "1.99.1"
bun = "1.4.2"
node = "24.21.0"
cargo-deny = "0.20.2"
zizmor = "1.31.1"
# Lossless PNG compression for docs/screenshots (`bun run screenshots`).
oxipng = "10.2.1"
# Release packaging (`bun run release:local`): third-party notices for the shipped binary, and its
# dependency list embedded for `cargo audit bin` and other SBOM scanners.
"github:EmbarkStudios/cargo-about" = "0.9.2"
"github:rust-secure-code/cargo-auditable" = "0.7.7"
"github:nextest-rs/nextest" = { version = "0.9.149", version_prefix = "cargo-nextest-" }
