version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Same 5-day settling window as bunfig.toml minimumReleaseAge.
    cooldown:
      default-days: 5
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Same 5-day settling window as bunfig.toml minimumReleaseAge.
    cooldown:
      default-days: 5
    groups:
      bun:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Same 5-day settling window as bunfig.toml minimumReleaseAge.
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
