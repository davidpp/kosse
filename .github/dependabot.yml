version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # 7 days: zizmor's dependabot-cooldown minimum; stricter than bunfig.toml's 5-day install guard.
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # 7 days: zizmor's dependabot-cooldown minimum; stricter than bunfig.toml's 5-day install guard.
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 7 days: zizmor's dependabot-cooldown minimum; stricter than bunfig.toml's 5-day install guard.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
