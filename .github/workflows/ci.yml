name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Rust comes from rustup + rust-toolchain.toml (with its components); mise supplies the rest of
  # mise.toml so CI and local checkouts use identical tool versions.
  MISE_DISABLE_TOOLS: rust
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: bun run check (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.11

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: bunx playwright install webkit chromium chromium-headless-shell

      - name: Browser suite (real server, owned fixtures)
        run: bun run test:e2e

      # The shipped WKWebView window (transparent, click-through), driven by real AppKit events (S11). The runner's
      # Aqua session already runs the app tests' tray and hidden windows in `check`.
      - name: Real-window suite (kosse window, owned fixtures)
        run: bun run test:window

      - name: Release archive in a sandbox (install, run, upgrade, uninstall)
        run: bun run test:package

      - name: Upload the release archive (not published)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kosse-aarch64-apple-darwin
          path: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/kosse.rb
          if-no-files-found: error
          retention-days: 14

      - name: Check left the tree unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  audit:
    name: Dependency and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.11
          install_args: bun cargo-deny zizmor

      - name: Audit
        run: bun run audit
