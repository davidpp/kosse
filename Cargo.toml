[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/fixtures"]
# Vendored third-party source: not linted or formatted as ours.
exclude = ["vendor/listeners"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/davidpp/stackscan"
publish = false

[workspace.dependencies]
kosse-core = { path = "crates/core" }
kosse-fixtures = { path = "crates/fixtures" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
# Already in the graph through axum; used directly for the SSE stream.
futures-util = { version = "0.3.34", default-features = false }
http-body-util = "0.1.5"
# HTTP/1 client connections for bounded probes (no pool, proxy, DNS or redirect machinery).
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
# Socket -> PID enumeration. Confined to crates/core/src/sockets.rs so API churn stays local.
# Patched below; see vendor/listeners/KOSSE-PATCH.md.
listeners = "0.6.1"
# Test-only: validates the shipped profile example against the emitted schema. No remote
# reference resolution (default features off).
jsonschema = { version = "0.59.0", default-features = false }
# Test-only self-signed certificates for the TLS fixture.
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
# kill(2) with typed errno and a positive-only PID type (process groups need a separate call).
# Already locked via tempfile (tests); new to the shipped graph with only process + std.
rustix = { version = "1.1.6", default-features = false, features = ["process", "std"] }
# JSON Schema for project profiles (`kosse config schema`), derived from the same types as the
# parser.
schemars = "1.2.3"
# debug-embed: debug builds embed assets too, so tests exercise the shipped code path.
rust-embed = { version = "8.13.0", features = ["debug-embed", "mime-guess"] }
# TLS for probes (and the test fixture's server): ring provider (smaller than aws-lc-rs), TLS 1.2
# and 1.3, no logging. Certificates are verified in process by webpki: no network access.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Trust anchors from the user's keychains (locally trusted development CAs included), read
# locally once.
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Process metadata only: no disk/network/component/user-database probing.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# no-serde-warnings: ts-rs ignores serde attributes it has no use for (`deserialize_with`) silently.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"
# Pedantic lints that fight idiomatic code here; `check` turns every remaining warning into an error.
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
# Keeps sockets whose process name is not valid UTF-8 (upstream drops them silently).
listeners = { path = "vendor/listeners" }
