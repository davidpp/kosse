[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/fixtures"]
# Vendored third-party source: not linted or formatted as ours.
exclude = ["vendor/listeners"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/davidpp/kosse"
publish = false

[workspace.dependencies]
kosse-core = { path = "crates/core" }
kosse-fixtures = { path = "crates/fixtures" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
# Already in the graph through axum; used directly for the SSE stream.
futures-util = { version = "0.3.34", default-features = false }
http-body-util = "0.1.5"
# HTTP/1 client connections for bounded probes (no pool, proxy, DNS or redirect machinery).
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
# `O_NOFOLLOW | O_NONBLOCK` for opening untrusted repository files. Already in the graph.
libc = "0.2.191"
# Socket -> PID enumeration. Confined to crates/core/src/sockets.rs so API churn stays local.
# Patched below; see vendor/listeners/KOSSE-PATCH.md.
listeners = "0.6.1"
# Test-only: validates the shipped profile example against the emitted schema. No remote
# reference resolution (default features off).
jsonschema = { version = "0.59.0", default-features = false }
# Test-only self-signed certificates for the TLS fixture.
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
# kill(2) with typed errno and a positive-only PID type (process groups need a separate call).
# Also the debug-only screenshot write (`O_NOFOLLOW`). Already in the graph through tempfile.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std"] }
# JSON Schema for project profiles (`kosse config schema`), derived from the same types as the
# parser.
schemars = "1.2.3"
# TLS for probes (and the test fixture's server): ring provider (smaller than aws-lc-rs), TLS 1.2
# and 1.3, no logging. Certificates are verified in process by webpki: no network access.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Trust anchors from the user's keychains (locally trusted development CAs included), read
# locally once.
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Native menu-bar icon and its menu (S08); macOS only in v1, so no GTK/appindicator features.
tray-icon = { version = "0.26.1", default-features = false }
# The tray's menu and the window's app menu; the same version tray-icon re-exports.
muda = { version = "0.21.2", default-features = false }
# Main-thread event loop for the tray (the Rune window brings its own winit loop).
tao = { version = "0.37.1", default-features = false, features = ["rwh_06"] }
# Bringing the dashboard window forward (NSRunningApplication activation, macOS 14 cooperative
# activation), its app icon, and the debug-only agent driver's AppKit events. Already in the graph
# through tao, rune and tray-icon; the two unsafe calls are listed under `unsafe_code` below.
objc2 = "0.6.5"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "libc",
  "NSApplication",
  "objc2-core-graphics",
  "NSEvent",
  "NSGraphicsContext",
  "NSImage",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
] }
# The window's application icon (NSImage from embedded PNG data) and, in debug builds only, its
# agent control socket (docs/agent-drive.md). All already in the graph
# through rune; these add features only.
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSData",
  "NSOperation",
  "NSString",
] }
# Decodes the embedded tray template PNGs. Already in the graph through muda.
png = "0.18.1"
# Process metadata only: no disk/network/component/user-database probing.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# no-serde-warnings: ts-rs ignores serde attributes it has no use for (`deserialize_with`) silently.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[workspace.lints.rust]
# `deny`, not `forbid`: the unavoidable AppKit calls opt in locally with
# `#[expect(unsafe_code, reason = …)]`: one in crates/app/src/activation.rs (the app icon) and one
# in the debug-only crates/app/src/window_control.rs (main-queue dispatch of agent input).
# crates/core forbids it outright.
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"
# Pedantic lints that fight idiomatic code here; `check` turns every remaining warning into an error.
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
# Keeps sockets whose process name is not valid UTF-8 (upstream drops them silently).
listeners = { path = "vendor/listeners" }
