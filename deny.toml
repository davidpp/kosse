# Dependency policy, checked by `bun run audit` and the CI audit job.
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
# v1 ships macOS arm64 only; evaluate the graph for that target.
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
# Vulnerabilities are always errors; unmaintained/yanked crates in our graph too.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing an MIT-licensed binary. Kept to the set actually
# in the graph; add others deliberately when a new dependency needs them.
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9
exceptions = [
  # MPL-2.0 (file-level copyleft), only for Rune's audio decoders: rune-kit depends on rune with its
  # default features, which include `ogg-audio` (symphonia, opuscule), and Cargo gives kosse no way
  # to turn a dependency's dependency's default features off. Kossé plays no audio. Shipped
  # unmodified; their source stays on crates.io and the release notices carry their license.
  { crate = "symphonia-utils-xiph", allow = ["MPL-2.0"] },
  { crate = "symphonia-metadata", allow = ["MPL-2.0"] },
  { crate = "symphonia-format-ogg", allow = ["MPL-2.0"] },
  { crate = "symphonia-format-mkv", allow = ["MPL-2.0"] },
  { crate = "symphonia-core", allow = ["MPL-2.0"] },
  { crate = "symphonia-codec-vorbis", allow = ["MPL-2.0"] },
  { crate = "symphonia", allow = ["MPL-2.0"] },
  { crate = "opuscule", allow = ["MPL-2.0"] },
  # ISC, permissive and MIT-compatible, allowed per crate rather than globally so a new ISC
  # dependency is a deliberate decision: the TLS stack the release binary ships for HTTP probes
  # (S04: rustls's ring provider and webpki certificate verifier), and libloading, which wgpu-hal
  # (Rune's GPU backend) uses to load system graphics libraries.
  { crate = "libloading", allow = ["ISC"] },
  { crate = "ring", allow = ["ISC"] },
  { crate = "rustls-webpki", allow = ["ISC"] },
  { crate = "untrusted", allow = ["ISC"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/anomalyco/rune"]
